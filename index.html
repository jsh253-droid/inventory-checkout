<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Inventory Check Out</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  :root { --text: #1f2328; --muted: #6b7280; --line: #d9dde3; --accent: #0b3d91; --bg: #fff; --row: #f6f8fa; --err: #b42318; --ok: #067647; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg); -webkit-text-size-adjust: 100%; }
  main { max-width: 820px; margin: 0 auto; padding: 12px 16px 104px; }
  input, select, button { font-family: inherit; }
  [hidden] { display: none !important; }

  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 0 16px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 10px; font-weight: 600; font-size: 18px; color: var(--muted); cursor: pointer; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }

  h2 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; margin: 28px 0 10px; }
  input { font-size: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); width: 100%; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .search { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 4px 0 8px; }
  .status { color: var(--muted); font-size: 14px; margin: 6px 0; min-height: 1.2em; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .empty { color: var(--muted); font-size: 14px; margin: 4px 0; }

  .list { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .list:empty { display: none; }
  .items { max-height: 60vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 56px; border-bottom: 1px solid var(--row); }
  .row:last-child { border-bottom: 0; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 500; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .low { color: var(--err); }

  button { cursor: pointer; }
  button.add { flex: none; border: 1px solid var(--accent); color: var(--accent); background: #fff; border-radius: 999px; padding: 0 16px; height: 40px; font-size: 15px; font-weight: 600; }
  button.add:disabled { border-color: var(--line); color: var(--muted); cursor: default; }
  .stepper { flex: none; display: flex; align-items: center; border: 1px solid var(--accent); border-radius: 999px; overflow: hidden; background: #fff; }
  .stepper button { width: 40px; height: 40px; border: 0; background: none; color: var(--accent); font-size: 22px; line-height: 1; }
  .stepper button:disabled { color: var(--line); cursor: default; }
  .stepper span { min-width: 28px; text-align: center; font-weight: 600; }
  .stepper input { width: 56px; height: 40px; border: 0; border-radius: 0; padding: 0; text-align: center; font-weight: 600; -moz-appearance: textfield; }
  .stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  button.icon { flex: none; width: 40px; height: 40px; border: 0; background: none; color: var(--muted); font-size: 24px; line-height: 1; }
  button.primary { background: var(--accent); border: 1px solid var(--accent); color: #fff; font-weight: 600; font-size: 16px; border-radius: 8px; padding: 0 20px; min-height: 48px; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.secondary { flex: none; border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 8px; padding: 0 12px; height: 40px; font-size: 14px; white-space: nowrap; }
  button.secondary:disabled { opacity: .6; }

  .person { display: grid; gap: 10px; margin-top: 12px; }
  .card { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
  .card-head { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--row); border-bottom: 1px solid var(--line); }
  .tag { flex: none; font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 3px; }
  .tag.OUT { background: #fef0c7; color: #93370d; }
  .tag.IN { background: #dcfae6; color: var(--ok); }

  .cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
  .cartbar span { font-weight: 600; }
  .footer { margin-top: 40px; font-size: 13px; }
  .footer a { color: var(--muted); }

  @media (min-width: 700px) {
    main { padding-top: 24px; }
    .tabs button { font-size: 20px; padding: 12px; }
    .items { max-height: 420px; }
    .person { grid-template-columns: 1fr 1fr; }
    .person button { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<main>
  <nav class="tabs" id="tabs"></nav>

  <section>
    <h2>Items</h2>
    <div class="search">
      <input id="filter" type="search" placeholder="Search items" autocomplete="off" enterkeyhint="search">
      <div id="items-status" class="status">Loading...</div>
    </div>
    <div id="items" class="list items"></div>
  </section>

  <section id="cart-section">
    <h2>Check out <span id="cart-count"></span></h2>
    <div id="cart-empty" class="empty">Tap <b>+ Add</b> on items above. You can add as many as you need, from any tab.</div>
    <div id="cart" class="list"></div>
    <form id="checkout" class="person" autocomplete="off">
      <input id="co-name" placeholder="Name" autocomplete="name" enterkeyhint="next" required>
      <input id="co-netid" placeholder="NetID" list="netids" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" required>
      <input id="co-team" placeholder="Team" list="teams" enterkeyhint="next">
      <input id="co-event" placeholder="Event" list="events" enterkeyhint="done">
      <button class="primary" type="submit" id="co-btn" disabled>Check out</button>
    </form>
    <datalist id="netids"></datalist>
    <datalist id="teams"></datalist>
    <datalist id="events"></datalist>
    <div id="co-status" class="status"></div>
  </section>

  <h2>Checked out now</h2>
  <div id="out"></div>

  <h2>Recent activity</h2>
  <div id="recent" class="list"></div>
  <p id="recent-empty" class="empty" hidden>No activity yet.</p>

  <p class="footer"><a id="admin-link" hidden>Admin</a></p>
</main>

<div class="cartbar" id="cartbar" hidden>
  <span id="cartbar-text"></span>
  <button class="primary" id="cartbar-btn" type="button">Review &amp; check out</button>
</div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
// Everything (all offices) comes from one request; the last copy is kept so
// the page can draw instantly on the next visit while it refreshes.
let data = null;
try { data = JSON.parse(store.get('data') || 'null'); } catch {}
let office = store.get('office');
// A link-only office (no tab button) shows when the link names it: ?office=Warehouse.
const linkOffice = (new URLSearchParams(location.search).get('office') || '').trim().toLowerCase();
let linkApplied = false;
const shownOffices = () => data.config.offices.filter(o => !(data.config.hidden || []).includes(o) || o.toLowerCase() === linkOffice);
// Cart lines: {office, item, qty}. Kept across reloads and tabs.
let cart = [];
try { cart = JSON.parse(store.get('cart') || '[]'); } catch {}
let cartInView = false;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const isConsumable = it => /consum/i.test(it.type || '');
// "Emma F (egf48)" when the backend found a name, else what was entered.
const personLabel = p => (p.name && p.netid && p.name !== p.netid ? `${p.name} (${p.netid})` : p.name || p.who);
// Current Qty as a number, or null when the sheet has something like "?".
const left = it => { const s = String(it?.qty ?? '').replace(/,/g, '').trim(); const n = Number(s); return s && isFinite(n) ? n : null; };

async function api(method, payload) {
  if (!window.API_URL) throw new Error('API_URL is not set in config.js');
  const res = method === 'GET'
    ? await fetch(API_URL)
    // text/plain avoids a CORS preflight, which Apps Script can't answer.
    : await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

function apply(d) {
  data = d;
  store.set('data', JSON.stringify(d));
  const linked = d.config.offices.find(o => o.toLowerCase() === linkOffice);
  if (linked && !linkApplied) { office = linked; linkApplied = true; }
  if (!shownOffices().includes(office)) office = shownOffices()[0];
  document.title = d.config.title;
  $('co-event').required = d.config.requireEvent;
  $('co-event').placeholder = d.config.requireEvent ? 'Event (required)' : 'Event';
  // Drop cart lines for items that no longer exist.
  cart = cart.filter(c => findItem(c.office, c.item));
  render();
}

const findItem = (off, name) => (data?.items[off] || []).find(it => it.name === name);

function renderTabs() {
  $('tabs').innerHTML = shownOffices().map(o => `<button class="${o === office ? 'active' : ''}">${esc(o)}</button>`).join('');
  [...$('tabs').children].forEach((b, i) => b.onclick = () => {
    office = shownOffices()[i];
    store.set('office', office);
    $('filter').value = '';
    renderTabs();
    renderItems();
    $('items').scrollTop = 0;
  });
}

// ---------- Cart ----------

const cartLine = (off, item) => cart.find(c => c.office === off && c.item === item);
const maxFor = c => left(findItem(c.office, c.item));

function setQty(line, qty) {
  const max = maxFor(line);
  line.qty = Math.max(0, Math.floor(qty) || 0);
  if (max !== null && line.qty > max) {
    line.qty = max;
    flash(`Only ${max} ${line.item} left.`, 'err');
  }
  if (!line.qty) cart = cart.filter(c => c !== line);
  saveCart();
}

function saveCart() {
  store.set('cart', JSON.stringify(cart));
  renderCart();
  renderItems();
}

function stepper(line, editable) {
  const max = maxFor(line);
  const mid = editable
    ? `<input type="number" inputmode="numeric" min="1"${max !== null ? ` max="${max}"` : ''} value="${esc(line.qty)}" aria-label="Quantity">`
    : `<span>${esc(line.qty)}</span>`;
  return `<div class="stepper"><button type="button" data-d="-1" aria-label="One fewer">−</button>${mid}` +
    `<button type="button" data-d="1" aria-label="One more"${max !== null && line.qty >= max ? ' disabled' : ''}>+</button></div>`;
}

function renderCart() {
  $('cart-count').textContent = cart.length ? `(${cart.length})` : '';
  $('cart-empty').hidden = cart.length > 0;
  $('cart').innerHTML = cart.map((c, i) => {
    const it = findItem(c.office, c.item) || {};
    return `<div class="row" data-c="${i}"><div class="grow"><div class="name">${esc(c.item)}</div>` +
      `<div class="meta">${esc([c.office, isConsumable(it) ? 'consumable' : ''].filter(Boolean).join(' · '))}</div></div>` +
      stepper(c, true) + `<button type="button" class="icon" data-remove aria-label="Remove ${esc(c.item)}">×</button></div>`;
  }).join('');
  $('co-btn').textContent = cart.length ? `Check out ${plural(cart.length, 'item')}` : 'Check out';
  $('co-btn').disabled = !cart.length;
  $('cartbar-text').textContent = `${plural(cart.length, 'item')} in cart`;
  updateBar();
}

function updateBar() { $('cartbar').hidden = !cart.length || cartInView; }

$('cart').onclick = e => {
  const row = e.target.closest('[data-c]');
  const btn = e.target.closest('button');
  if (!row || !btn) return;
  const line = cart[row.dataset.c];
  if (btn.hasAttribute('data-remove')) { cart = cart.filter(c => c !== line); saveCart(); }
  else setQty(line, line.qty + Number(btn.dataset.d));
};
$('cart').onchange = e => {
  if (e.target.tagName !== 'INPUT') return;
  setQty(cart[e.target.closest('[data-c]').dataset.c], Math.max(1, Number(e.target.value)));
};

// ---------- Items ----------

function renderItems() {
  const items = data.items[office] || [];
  const q = $('filter').value.trim().toLowerCase();
  const list = items.map((it, i) => ({ ...it, i }))
    .filter(it => !q || [it.name, it.category, it.location, it.type].join(' ').toLowerCase().includes(q));
  $('items-status').className = 'status';
  $('items-status').textContent = q ? `${list.length} of ${plural(items.length, 'item')}` : plural(items.length, 'item');
  $('items').innerHTML = list.map(it => {
    const n = left(it);
    const line = cartLine(office, it.name);
    const stock = n === null ? (it.qty || '') : `${n} left`;
    const meta = [stock, it.location || it.category, isConsumable(it) ? 'consumable' : ''].filter(Boolean).join(' · ');
    const action = line ? stepper(line)
      : n !== null && n <= 0 ? '<button type="button" class="add" disabled>None left</button>'
      : `<button type="button" class="add" data-d="1" aria-label="Add ${esc(it.name)}">+ Add</button>`;
    return `<div class="row" data-i="${it.i}"><div class="grow"><div class="name">${esc(it.name)}</div>` +
      `<div class="meta${n !== null && n <= 0 ? ' low' : ''}">${esc(meta)}</div></div>${action}</div>`;
  }).join('');
}

$('items').onclick = e => {
  const btn = e.target.closest('button[data-d]');
  if (!btn) return;
  const it = data.items[office][btn.closest('[data-i]').dataset.i];
  const line = cartLine(office, it.name);
  if (line) return setQty(line, line.qty + Number(btn.dataset.d));
  cart.push({ office, item: it.name, qty: 1 });
  saveCart();
};
$('filter').oninput = renderItems;

// ---------- Checked out / recent ----------

function renderOut() {
  const reusable = data.out;
  if (!reusable.length) { $('out').innerHTML = '<p class="empty">Nothing checked out.</p>'; return; }
  // One card per person.
  const groups = new Map();
  reusable.forEach(o => {
    if (!groups.has(o.key)) groups.set(o.key, []);
    groups.get(o.key).push(o);
  });
  $('out').innerHTML = [...groups.entries()].map(([key, g]) => {
    const first = g[0];
    const events = [...new Set(g.map(o => o.event).filter(Boolean))].join(', ');
    const oldest = g.reduce((a, o) => (o.since < a ? o.since : a), first.since);
    return `<div class="card"><div class="card-head"><div class="grow"><div class="name">${esc(first.name)} <span class="meta">${esc(first.netid !== first.name ? first.netid : '')}</span></div>` +
      `<div class="meta">${esc([first.team, events, 'out since ' + when(oldest)].filter(Boolean).join(' · '))}</div></div>` +
      (g.length > 1 ? `<button type="button" class="secondary" data-key="${esc(key)}">Check in all ${g.length}</button>` : '') + '</div>' +
      g.map((o, i) => `<div class="row"><div class="grow"><span class="name">${esc(o.item)}</span> <span class="meta">×${esc(o.qty)}</span><div class="meta">${esc(o.office)}</div></div>` +
        `<button type="button" class="secondary" data-key="${esc(key)}" data-i="${i}">Check in</button></div>`).join('') + '</div>';
  }).join('');
}

function renderRecent() {
  $('recent-empty').hidden = data.recent.length > 0;
  $('recent').innerHTML = data.recent.map(e => {
    const isIn = /check in/i.test(e.action);
    const items = e.items.map(it => `${it.item} ×${it.qty}`).join(', ');
    return `<div class="row"><span class="tag ${isIn ? 'IN' : 'OUT'}">${isIn ? 'IN' : 'OUT'}</span><div class="grow"><span class="name">${esc(items || '(no items)')}</span>` +
      `<div class="meta">${esc([personLabel(e), e.event, when(e.ts)].filter(Boolean).join(' · '))}</div></div></div>`;
  }).join('');
}

$('out').onclick = async e => {
  const btn = e.target.closest('button[data-key]');
  if (!btn) return;
  const group = data.out.filter(o => o.key === btn.dataset.key);
  const lines = btn.dataset.i === undefined ? group : [group[btn.dataset.i]];
  $('out').querySelectorAll('button').forEach(b => b.disabled = true);
  btn.textContent = 'Checking in...';
  try {
    apply(await api('POST', { action: 'checkin', who: lines[0].who, items: lines.map(o => ({ office: o.office, item: o.item, qty: o.qty })) }));
    flash(`Checked in ${plural(lines.length, 'item')}.`, 'ok');
  } catch (err) {
    flash('Check in failed: ' + err.message, 'err');
    renderOut();
  }
};

// ---------- Load / submit ----------

function render() {
  renderTabs();
  renderItems();
  renderCart();
  renderOut();
  renderRecent();
  $('netids').innerHTML = Object.entries(data.people).map(([id, n]) => `<option value="${esc(id)}">${esc(n)}</option>`).join('');
  $('teams').innerHTML = data.teams.map(t => `<option value="${esc(t)}">`).join('');
  $('events').innerHTML = data.events.map(ev => `<option value="${esc(ev)}">`).join('');
}

async function load() {
  try {
    apply(await api('GET'));
  } catch (err) {
    $('items-status').className = 'status err';
    $('items-status').textContent = (data ? 'Showing saved copy. ' : '') + 'Could not load: ' + err.message;
  }
}

function flash(msg, cls) { $('co-status').className = 'status ' + cls; $('co-status').textContent = msg; }

// Autofill: last-used details; a known NetID fills the name.
['name', 'netid', 'team', 'event'].forEach(k => { $('co-' + k).value = store.get(k); });
$('co-netid').oninput = () => {
  const n = data?.people[$('co-netid').value.trim().toLowerCase()];
  if (n) $('co-name').value = n;
};

$('checkout').onsubmit = async e => {
  e.preventDefault();
  if (!cart.length) return flash('Add at least one item.', 'err');
  const btn = $('co-btn');
  btn.disabled = true;
  btn.textContent = 'Checking out...';
  const body = { action: 'checkout', items: cart.map(c => ({ office: c.office, item: c.item, qty: c.qty })) };
  ['name', 'netid', 'team', 'event'].forEach(k => { body[k] = $('co-' + k).value.trim(); });
  try {
    const fresh = await api('POST', body);
    ['name', 'netid', 'team', 'event'].forEach(k => store.set(k, body[k]));
    cart = [];
    store.set('cart', '[]');
    $('filter').value = '';
    apply(fresh);
    flash(`Checked out ${plural(body.items.length, 'item')} to ${body.name}.`, 'ok');
  } catch (err) {
    flash('Check out failed: ' + err.message, 'err');
    renderCart();
  }
};

$('cartbar-btn').onclick = () => {
  $('cart-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  const empty = ['co-name', 'co-netid'].find(id => !$(id).value.trim());
  if (empty) setTimeout(() => $(empty).focus({ preventScroll: true }), 400);
};
// Hide the bottom cart bar while the cart itself is on screen.
if ('IntersectionObserver' in window) {
  new IntersectionObserver(([entry]) => { cartInView = entry.isIntersecting; updateBar(); }).observe($('cart-section'));
}

if (window.ADMIN_URL) { $('admin-link').href = ADMIN_URL; $('admin-link').hidden = false; }
// Saved copy from an older version of the page has a different shape.
if (data && !Array.isArray(data.teams)) data = null;
if (data) { apply(data); $('items-status').textContent += ' · updating…'; }
renderCart();
load();
</script>
</body>
</html>
